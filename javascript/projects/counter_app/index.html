<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">
        <!-- box -->
        <div id="box">
            <h1>Counter App</h1>
            <h2 id="count"></h2>
        </div>

        <!-- buttons -->
        <div>
            <button id="increment_btn" class="btn">Increase Count</button>
            <button id="decrement_btn" class="btn">Decrease Count</button>
            <button id="reset_btn" class="btn">Reset Count</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
